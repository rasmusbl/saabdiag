name: Offline simulation
on: [push, pull_request]
jobs:
  simulation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore SaabDiag.slnx --configfile NuGet.Config
      - run: dotnet build SaabDiag.slnx -c Release --no-restore
      - run: dotnet run --project tests/SaabDiag.Tests -c Release --no-build --no-restore
